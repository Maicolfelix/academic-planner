services:
  postgres:
    image: postgres:17-alpine
    container_name: academic-planner-db
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: academic_planner
    ports:
      # 5433 on the host so it never clashes with a locally installed PostgreSQL (5432).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d academic_planner']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
