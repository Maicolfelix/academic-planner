name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: academic_planner
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U planner -d academic_planner"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://planner:planner@localhost:5433/academic_planner
      TEST_DATABASE_URL: postgresql://planner:planner@localhost:5433/academic_planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The OCR tests draw their own images with the generic `sans-serif`; Liberation Sans (Arial-metric)
      # gives the runner the same kind of font a developer machine has.
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig && fc-cache -f
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run security:scan
      - run: npm run docs:check
      # Only what ships to users. Dev-only advisories are reviewed by hand (docs/security.md §15).
      - run: npm audit --omit=dev
